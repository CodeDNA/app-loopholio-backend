[build-system]
requires = ["setuptools>=61.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "loopholio-backend"
version = "0.1.0"
description = "ToS legal risk analysis backend"
requires-python = ">=3.10"
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "python-dotenv",
    "pydantic",
    "langgraph",
    "langchain-core",
    "langchain-openai",
    "langchain-google-genai",
    "docling",
    "python-multipart",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]